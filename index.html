<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Niraja's creaction - Calculator</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body data-theme="dark">
  <div class="calculator-app">
    <!-- Top toolbar -->
    <header class="calc-header">
      <div class="brand">
        <span class="brand-icon">✨</span>
        <span class="brand-name">Niraja's creaction</span>
      </div>
      <div class="header-actions">
        <button id="soundToggle" class="icon-btn" title="Toggle Voice & Audio Feedback" aria-label="Toggle Voice and Sound">
          <span class="sound-icon">🔊</span>
        </button>
        <button id="historyToggle" class="icon-btn" title="Calculation History" aria-label="Toggle History">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
          </svg>
        </button>
        <button id="themeToggle" class="icon-btn" title="Switch Theme (Dark / Light)" aria-label="Switch Theme">
          <span class="theme-icon">☀️</span>
        </button>
      </div>
    </header>

    <!-- Main Calculator Shell -->
    <main class="calc-wrapper">
      <div class="calc-container">
        <!-- Screen / Display (Single Line Display) -->
        <div class="calc-display" id="displayArea" title="Click to copy result">
          <div class="single-line-display" id="singleLineDisplay">
            <div class="calc-line" id="calcLine" aria-live="polite">
              <span class="num-part">0</span>
            </div>
          </div>
          <div class="copy-toast" id="copyToast">Copied!</div>
        </div>

        <!-- Keypad -->
        <div class="calc-grid">
          <!-- Row 1 -->
          <button class="calc-btn fn" data-action="clear" data-key="Escape" title="Clear (Esc)">AC</button>
          <button class="calc-btn fn" data-action="delete" data-key="Backspace" title="Backspace (⌫)">⌫</button>
          <button class="calc-btn fn" data-action="percent" data-key="%" title="Percent (%)">%</button>
          <button class="calc-btn op" data-action="operator" data-value="÷" data-key="/" title="Divide (/)">÷</button>

          <!-- Row 2 -->
          <button class="calc-btn num" data-action="number" data-value="7" data-key="7">7</button>
          <button class="calc-btn num" data-action="number" data-value="8" data-key="8">8</button>
          <button class="calc-btn num" data-action="number" data-value="9" data-key="9">9</button>
          <button class="calc-btn op" data-action="operator" data-value="×" data-key="*" title="Multiply (*)">×</button>

          <!-- Row 3 -->
          <button class="calc-btn num" data-action="number" data-value="4" data-key="4">4</button>
          <button class="calc-btn num" data-action="number" data-value="5" data-key="5">5</button>
          <button class="calc-btn num" data-action="number" data-value="6" data-key="6">6</button>
          <button class="calc-btn op" data-action="operator" data-value="-" data-key="-" title="Subtract (-)">−</button>

          <!-- Row 4 -->
          <button class="calc-btn num" data-action="number" data-value="1" data-key="1">1</button>
          <button class="calc-btn num" data-action="number" data-value="2" data-key="2">2</button>
          <button class="calc-btn num" data-action="number" data-value="3" data-key="3">3</button>
          <button class="calc-btn op" data-action="operator" data-value="+" data-key="+" title="Add (+)">+</button>

          <!-- Row 5 -->
          <button class="calc-btn fn" data-action="negate" data-key="n" title="Negate (±)">±</button>
          <button class="calc-btn num" data-action="number" data-value="0" data-key="0">0</button>
          <button class="calc-btn num" data-action="decimal" data-value="." data-key="." title="Decimal (.)">.</button>
          <button class="calc-btn equals" data-action="equals" data-key="Enter" title="Equals (= or Enter)">=</button>
        </div>

        <!-- Keyboard hints footer -->
        <footer class="calc-hints">
          <span>Keyboard friendly: <code>0-9</code> <code>+ - * /</code> <code>Enter</code> <code>Esc</code> <code>Backspace</code></span>
        </footer>
      </div>

      <!-- Slide-over History Drawer -->
      <aside class="history-panel" id="historyPanel" aria-hidden="true">
        <div class="history-header">
          <h3>History</h3>
          <div class="history-controls">
            <button id="clearHistoryBtn" class="text-btn danger" title="Clear all history">Clear</button>
            <button id="closeHistoryBtn" class="icon-btn small" title="Close history" aria-label="Close history">✕</button>
          </div>
        </div>
        <div class="history-list" id="historyList">
          <div class="empty-history">No calculations yet</div>
        </div>
      </aside>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
